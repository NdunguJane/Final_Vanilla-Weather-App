<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vanilla Weather App_Final</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <img
          src="https://s3.amazonaws.com/shecodesio-development/uploads/files/000/000/001/original/logo.png?1627901693"
          class="logo"
          alt="SheCodes Logo"
        />
      </header>

      <form id="search-form" class="search-form">
        <input
          type="search"
          placeholder="Search a city..."
          id="city-input"
          autocomplete="off"
          required
        />

        <button type="submit">Search</button>
      </form>

      <main>
        <div class="weather-card">
          <div class="weather-top">
            <div>
              <h1 id="city-name">Nairobi</h1>

              <p id="current-date-time"></p>

              <div class="description">
                <span id="description">Clear Sky</span>
              </div>
            </div>

            <div id="weather-icon"></div>
          </div>

          <div class="temperature-section">
            <span id="temperature">22</span>
            <span class="unit">°C</span>
          </div>

          <div class="feels-like">
            Feels like:
            <span id="feels-like">24</span>°C
          </div>

          <div class="weather-details">
            <div>
              Humidity
              <strong><span id="humidity">64</span>%</strong>
            </div>

            <div>
              Wind
              <strong><span id="wind-speed">3</span> km/h</strong>
            </div>
          </div>
        </div>

        <div class="forecast" id="forecast"></div>
      </main>

      <footer>
        This project was coded by
        <a
          href="https://github.com/NdunguJane/Vanilla-Weather-App"
          target="_blank"
        >
          Jane Ndungu
        </a>
        and is
        <a
          href="https://github.com/NdunguJane/Vanilla-Weather-App"
          target="_blank"
        >
          open-sourced on GitHub
        </a>
      </footer>
    </div>
    <script src="index.js"></script>
  </body>
</html>
